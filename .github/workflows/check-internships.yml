name: Check for new internship postings

on:
  schedule:
    # Runs every 30 minutes. GitHub may delay this slightly under load.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

# Prevents two runs from overlapping and racing to push state.json at the
# same time, which is the most common cause of the push getting rejected.
concurrency:
  group: internship-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          git config user.name "internship-watcher-bot"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update state [skip ci]"
          # If the remote moved on since checkout (e.g. you pushed a manual
          # edit, or a previous run's push landed just before this one),
          # rebase onto the latest remote commit and retry a few times
          # rather than failing outright.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, pulling and retrying ($i/5)..."
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
          echo "Failed to push after retries."
          exit 1